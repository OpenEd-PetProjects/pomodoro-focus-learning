<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таймер Pomodoro</title>
  <link rel="stylesheet" href="style.css">
  <script src="timer.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Таймер Pomodoro</h1>
    <p id="mode">Работа</p>
    <p id="time" aria-label="Оставшееся время">25:00</p>
    <button id="start" type="button">Запустить</button>
    <button id="stop" type="button">Остановить</button>
  </main>
</body>
</html>
